# OpenEvolve konfigürasyonu — P5 covering V28 REKOR DENEMESİ (dilim-5)
# Tek hücre odagi: C(28,9,3). Baslangic genomu = gen-200 evrilmis cozucu
# (evolve/artifacts/best_covering_gen200_20260810.py). Sure butcesi 70 sn
# (COVERING_SEED_TIME_S=70), runner limiti 80 sn (-SolverTimeoutS 80).
# GLM 150 iterde 0.6798 platosu; genom cyclic fikri buldu ama sig uyguladi
# (MULTI_BASE_MAX=2). Yapisal sicrama icin Opus + full-rewrite.
# Çalıştırma (repo kökünden; COVERING_SEED_TIME_S=50 env ŞART):
#   $env:COVERING_SEED_TIME_S="50"
#   .\evolve\run.ps1 -GeceKosusuBitti -Problem covering `
#     -ConfigPath evolve\config.covering.yaml -ProxyConfig config.glm.yaml `
#     -InitialProgram problems\covering\seed_solver.py `
#     -Instance ("data\covering\instances\cover-v28-k9-t3.cover;" +
#                "data\covering\instances\cover-v32-k8-t4.cover;" +
#                "data\covering\instances\cover-v13-k3-t2.cover")
# Fitness seti: 2 gradyan (v28 hizli, v32 buyuk) + 1 bekçi (v13 kanıtlı-opt).
# HOLDOUT (döngü asla görmez): cover-v24-k6-t4, cover-v7-k3-t2 —
# genelleme iddiası ancak holdout yeniden değerlendirmesiyle (skill §3.5).
# GLM Coding Plan Lite (8318) — Opus plato kartı olarak saklanıyor.
# system_message'ta arşiv/rekor değeri YOK (§0.5 sızıntı kuralı).

max_iterations: 2000
checkpoint_interval: 25
log_level: INFO
random_seed: 42
diff_based_evolution: false   # OPUS PLATO KARTI: yapisal sicrama tam-dosya
                              # yeniden yazimla gelir; Opus diff kesilme gecmisi.
max_code_length: 35000  # 30k asimi: Opus tam-dosya yazimlari 30-31k karaktere ulasti (2026-08-10)

llm:
  api_base: "http://localhost:8317/v1"   # cli-proxy-api Claude OAuth (config.yaml)
  api_key: "${OPENAI_API_KEY}"           # run.ps1 dolduruyor; repoya yazılmaz
  models:
    - name: "claude-opus-5"              # Opus plato karti (CLAUDE.md §5)
      weight: 1.0
  temperature: 0.8
  max_tokens: 20000
  timeout: 600
  retries: 3

prompt:
  system_message: |
    You are evolving `solver.py`, a single-file Python solver for the
    **covering design** problem C(v,k,t): given a universe {1..v}, output
    a collection of k-element blocks such that EVERY t-element subset of
    the universe is contained in at least one block. MINIMIZE the number
    of blocks.

    Contract — breaking any of these gets a heavily penalized score:
    - CLI: python solver.py <instance.cover> <output.txt>
    - Input: line-based text; '#' starts a comment. Headers: `v <int>`,
      `k <int>`, `t <int>` with v > k > t >= 1. Nothing else.
    - Output: one block per line — EXACTLY k DISTINCT integers in 1..v,
      separated by whitespace. Order inside a line and order of lines do
      not matter; a block is a SET. Two lines that contain the same set of
      numbers are a VIOLATION (duplicate_block). A line with the wrong
      count, repeats, out-of-range or non-integer tokens is a violation
      (bad_block) and poisons the whole solution. Lines starting with '#'
      are ignored; you MAY write `# size <int>` as your own block count —
      it is IGNORED for scoring (the evaluator recounts exactly) but
      logged as an honesty sensor.
    - Feasibility: every one of the C(v,t) t-subsets must be inside at
      least one of your blocks. The evaluator recomputes coverage with
      exact integer arithmetic; any uncovered t-subset makes the solution
      infeasible and scores far below ANY feasible covering, no matter
      how bloated. Feasibility first, then shrink.
    - Scoring (feasible): Schoenheim_lower_bound(v,k,t) / block_count,
      in (0, 1]. Fewer blocks = higher score; 1.0 means you matched the
      Schoenheim bound (rarely tight for larger cells). The reported
      score is the MEAN over all instances in the fitness set; one
      infeasible instance drags the mean hard, so robustness across
      (v,k,t) matters as much as peak quality on one cell.
    - Determinism: same input must produce same output (fixed seeds only).
    - Resources: single process, CPU only; time budget in seconds is given
      by the COVERING_SEED_TIME_S environment variable (70 s in this run) and
      the runner hard-kills at 80 s wall clock. Python stdlib and numpy are
      available. No network; no file access other than the two argv paths.

    ANYTIME IS MANDATORY. Maintain a `.tmp` file and atomically replace
    the real output (`os.replace`) whenever you have a better solution.
    Write a COMPLETE covering as early as possible (a greedy one within a
    few seconds), then keep replacing it with smaller coverings until the
    budget runs out. If the runner kills you before your first write, the
    empty output scores at the very bottom. Partial coverage output is
    graded (less-uncovered is less bad) but still infeasible — reaching
    full coverage fast is the first milestone on every instance.

    Promising directions:
    - Stronger greedy: pick each block to maximize NEWLY covered t-subsets
      (the seed only samples a few candidates per step — full or smarter
      candidate evaluation with incremental data structures is an obvious
      first upgrade).
    - Local search: remove blocks whose t-subsets are all covered twice;
      ruin-and-recreate (drop j blocks, re-repair greedily, keep if not
      worse); block-exchange moves; simulated annealing over block sets.
    - SYMMETRY is the big lever in covering design construction: cyclic
      constructions (choose base blocks, close them under x -> x+1 mod v),
      or other group actions, shrink the search space enormously and
      produce very regular coverings. Evolve code that SEARCHES for good
      base blocks under a group action — do NOT hardcode specific block
      lists or known table values. Mind the orbit arithmetic: one base
      block yields at most v blocks, so a covering of B blocks needs on
      the order of B/v base blocks — often 15-25 for the larger cells
      here, not 2-3. A cyclic phase that tries only a couple of base
      blocks cannot even in principle assemble a competitive covering
      for the big cells; search over SETS of many base blocks (e.g.
      greedily add the orbit covering the most uncovered t-sets, then
      patch the remainder).
    - Mixed strategies: symmetric skeleton + greedy patching of the
      leftover uncovered t-subsets often beats either alone.

    SCALE: this run targets a SINGLE cell — v=28, k=9, t=3 (C(28,3)=3276
    t-subsets; each block covers C(9,3)=84 of them; good coverings have
    on the order of tens of blocks, so orbit skeletons here need only a
    handful of orbits and the endgame is won or lost in the local-search
    phase that removes the last few blocks). Use the whole 70 s budget:
    deep local search, many kicks/restarts, aggressive endgame (try to
    delete each block and repair before giving up).
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true      # stderr + violation özeti LLM'e geri döner

database:
  population_size: 200
  archive_size: 50
  num_islands: 4
  elite_selection_ratio: 0.1
  exploration_ratio: 0.2
  exploitation_ratio: 0.7

evaluator:
  timeout: 150                 # 1 instance x 80 sn solver + doğrulama + tampon
                               # (covering doğrulama B*C(k,t) — ms mertebesi)
  cascade_evaluation: false
  parallel_evaluations: 2
  memory_limit_mb: 2048
  enable_artifacts: true
